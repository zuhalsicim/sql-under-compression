name: benchmark

# A push that changes code runs the smoke test: 5 questions, every precision on
# its own machine, all at the same time.
# The full run is started by hand in the Actions tab: 200 questions, all four
# precisions one after the other on one machine.
on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "results/**"
  workflow_dispatch:
    inputs:
      questions:
        description: "Number of questions (200 = full run, 5 = smoke test)"
        default: "200"
      machines:
        description: "JSON list with one entry per machine: the precisions that run on it"
        default: '["f16 q8_0 q5_k_m q4_k_m"]'

permissions:
  contents: read

# A newer run stops an older run of the same kind on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUESTIONS: ${{ inputs.questions || '5' }}
  # pruna sends anonymous usage data unless this is set.
  PRUNA_METRICS_ENABLED: "false"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  benchmark:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Without an input (the smoke test) every precision gets its own machine.
        precisions: ${{ fromJSON(inputs.machines || '["f16", "q8_0", "q5_k_m", "q4_k_m"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Show the machine and make room on the disk
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core"
          free -h
          # The 3 GB model lies on the disk three times while pruna converts it.
          # These two folders hold tools that this job does not use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          df -h /
      - name: Install pruna and llama-cpp-python
        run: |
          pip install -r requirements.txt
          # A run writes its files to output/. The folder results/ in the
          # repository holds the published full run and is never touched.
          mkdir output
          pip freeze > output/pip-freeze-machine-${{ strategy.job-index }}.txt
      - name: "Step 1: download Spider"
        run: python fetch_spider.py data
      - name: "Steps 2 to 4 for every precision of this machine"
        shell: bash  # with this line a failure of compress.py is not hidden by "tee"
        env:
          PRECISIONS: ${{ matrix.precisions }}
        run: |
          for precision in $PRECISIONS; do
            # Step 2: compress the model with pruna.
            python compress.py $precision model 2>&1 | tee compress.log
            # Keep what llama.cpp says about the memory of the weights.
            grep "model buffer size" compress.log > output/$precision.llama_load.txt || true
            # Step 3: evaluate.
            python evaluate.py model data/spider "$QUESTIONS" output/$precision.json
            # Step 4: evaluate again with pruna's tools.
            python evaluate_with_pruna.py model data/spider output/$precision.json output/$precision.pruna.json
            rm -rf model
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-machine-${{ strategy.job-index }}
          path: output/

  table:
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: results-machine-*
          path: output
          merge-multiple: true
      - name: "Step 5: make the table"
        run: |
          echo "Questions per precision: $QUESTIONS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python make_table.py output >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: output/
